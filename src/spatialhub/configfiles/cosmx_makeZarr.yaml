resources:
    account: slurm_account
    threads: 4
    mem_mb: 32000
    time: "4:00:00"
    partition: "short"

outdir: /path/to/output/directory

# Probes to ignore when generating the Zarr file.
# These are typically control probes and/or other probes that require specific handling in downstream analyses
# (e.g. bacterial probes added to mouse probe panel).
ctrl_regex: SystemControl|Negative
other_regex: Bact|Heli|16S

# Image parameters
channel_names: PanCK,CD68,Membrane,CD45,DNA
scales: 2,8

slides:
    slide1:
        tx_csv: /path/to/slide1/tx_file.csv.gz
        pg_csv: /path/to/slide1/polygons.csv.gz
        samples:
            SS_prox1a: 1,2,3-5
            SS_dist1a: 1-12
    slide2:
        tx_csv: /path/to/slide2/tx_file.csv.gz
        pg_csv: /path/to/slide2/polygons.csv.gz
        samples:
            SS_prox1b: 6-6,1-5
            SS_dist1b: 181-191,32
