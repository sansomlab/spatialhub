resources:
    slurm_account: slurm_account
    threads: 2
    mem_mb: 128000
    runtime: 240
    slurm_partition: "long"

# Resources for GPU rules (Cellpose). Any key here overrides the value above.
gpu_resources:
    slurm_account: slurm_gpu_account
    threads: 2
    mem_mb: 96000
    runtime: 1440 # minutes; must fit the partition's MaxTime
    n_gpus: 1 # requested as gres gpu:<n_gpus>
    slurm_partition: gpu_partition

outdir: /path/to/rctd/output/folder/
mode: full # options: full|doublet|multi

tasks:
    task1:
        reference: /path/to/curated/reference/atlas/anndata.h5ad
        query: /path/to/query/spatial/data/task1.h5ad
        celltype: celltype # a column in the reference anndata.obs that contains the cell type annotation to be deconvolved
        min_umi: 20
        min_umi_sigma: 60
        xcoord: array_col
        ycoord: array_row
    task2:
        reference: /path/to/curated/reference/atlas/anndata.h5ad
        query: /path/to/query/spatial/data/task2.h5ad
        celltype: celltype # a column in the reference anndata.obs that contains the cell type annotation to be deconvolved
        min_umi: 20
        min_umi_sigma: 60
        xcoord: array_col
        ycoord: array_row
