resources:
    account: slurm_account
    threads: 2
    mem_mb: 128000
    time: "30:00:00"
    partition: "short"


# Input SpatialData Zarr directory
zarr_dir: "spatialdata.dir"

# Optional explicit sample selection (for example, to pilot segmentation on a subset of samples)
# Set to null to discover all .zarr directories.
sample_ids: null

# Output segmentation directory
segment_dir: "sopa.segment.dir"
overwrite_mask: false  # whether to overwrite existing segmentation masks in the output directory if using the same mask_key


# Elements from input SpatialData object to draw from for segmentation
image_key: 'image'
points_key: 'main'
prior_segment_key: 'atomx_segments'

# SOPA patch size (in pixels) and overlap (in pixels)
tx_patch_width: 8000
tx_patch_ovlp: 200
tx_min_transcripts: 5000  # minimum transcripts per patch to enable downstream segmentation
    # e.g. SOPA/baysor fails if there are <4000 transcripts in one patch (4000 set by SOPA developers)

# Segmentation
# only one at a time supported in beta release (zarr lock issues to be resolved)
run_baysor: true
run_proseg: true

# Baysor
bs_config:
    data:
        force_2d: True
        min_molecules_per_cell: 10
        x: "x"
        y: "y"
        z: "z"
        gene: "target"
        min_molecules_per_gene: 0
        min_molecules_per_segment: 3
        confidence_nn_id: 6
    segmentation:
        scale: 80        # typical cell radius in microns (IMPORTANT)
        scale_std: "25%" # cell radius standard deviation
        prior_segmentation_confidence: 0.5
        estimate_scale_from_centers: False
        n_clusters: 4
        iters: 1000
        n_cells_init: 0
        nuclei_genes: ""
        cyto_genes: ""
bs_cell_area: 100
bs_gene_column: "target"

# Proseg


# Segmentation shape key
bs_mask_key: "baysor"
ps_mask_key: "proseg"