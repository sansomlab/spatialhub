resources:
    slurm_account: slurm_account
    threads: 16
    mem_mb: 96000
    time: "04:00:00"
    slurm_partition: short

gpu_resources:
    slurm_partition: gpu_short       # your actual GPU partition name
    n_gpus: 1                        # becomes --gres=gpu:1
    # gres_cmd: "--gpus-per-node 1"  # override to use gpus-per-node instead

zarr_dir: /path/to/zarr/directory

shapes_to_add:
    cellpose:
        ch_nuc: DNA
        ch_cyto: Membrane
        mdl_path: /path/to/cellpose/model
        dp: 125
        gpu: true
        patch_width: NULL
        patch_overlap: 50
        img_key: image
        flow_threshold: 0.4
        cellprob_threshold: 0.0
        clip_limit: 0.2
        gaussian_sigma: 1
