resources:
    account: slurm_account
    threads: 16
    mem_mb: 64000
    time: "01:00:00"
    slurm_partition: short

zarr_dir: /path/to/directory/containing/zarr/files
h5ad_dir: /path/to/directory/for/h5ad/files/to/be/created

bysample_outputs:
    atomx_counts:
        points_from: main
        shapes_by: atomx_segments
        seg_idx: atomx_index
        agg_func: sum
        agg_name: counts
        coords: global
    baysor_counts:
        points_from: main
        shapes_by: baysor_segments
        seg_idx: baysor_index
        agg_func: sum
        agg_name: counts
        coords: global
    cellpose_counts:
        points_from: main
        shapes_by: cellpose_segments
        seg_idx: NULL
        agg_func: sum
        agg_name: counts
        coords: global
