# Suggested QC configuration for CosMx projects (very low level thresholds for first pass QC filtering )

# Cell-level QC thresholds
instance_nCount_cutoff: 20 
instance_nFeature_cutoff: 5
instance_percentNeg_cutoff: 5
instance_complexity_cutoff: 1

# FOV-level QC thresholds
fov_nCount_cutoff: 50
fov_SNR_cutoff: 3

# Sample-level QC thresholds
sampleMinInstances: 2000   # minimal number of instances passing QC for the sample to be considered high quality
sampleMinPercent: 50    # minimal percentage of instances passing QC for the sample to be considered high quality
exclInstancesInFailedFOVs: true  # when calculating the number of instances that pass QC for the sample, should high-quality instances in bad quality FOVs be excluded? (true/false)