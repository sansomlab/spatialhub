resources:
    account: slurm_account
    threads: 16
    mem_mb: 64000
    time: "30:00:00"
    slurm_partition: short

outdir: /path/to/output/directory

import_adata: False
  # whether to import the pre-computed AnnData object from the Xenium Onboard Analysis directory
  # (recommended: use spatialhub to re-generate it downstream of the retained segmentation mask)

slides:
    slide1:
        xoa_dir: /path/to/slide1/xenium_onboard_analysis
    slide2:
        xoa_dir: /path/to/slide2/xenium_onboard_analysis
